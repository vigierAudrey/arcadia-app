# docker-compose.production.yml — ArcadiA en production (VPS Hetzner)
#
# Stack strictement séparée de la stack Blob (`blobconnect-vps`) :
#   projet, réseau, sous-réseau, volume, base, secrets et logs distincts.
#
# La SEULE ressource partagée avec Blob est le reverse proxy Caddy, qui détient
# les ports 80/443 du serveur. Le service web d'ArcadiA est donc attaché en plus
# au réseau Docker de Blob, uniquement pour que Caddy puisse l'atteindre.
# PostgreSQL, lui, reste sur le réseau privé d'ArcadiA : Blob ne peut pas le voir.
#
# ⚠️ NOMS DE CONTENEURS UNIQUES — NE PAS RENOMMER À LA LÉGÈRE
# Le service web est présent sur DEUX réseaux, et le réseau de Blob contient déjà
# un service nommé « postgres ». Si la base d'ArcadiA s'appelait « postgres »,
# la résolution DNS Docker serait ambiguë et ArcadiA pourrait se connecter à la
# base de Blob. D'où les noms explicites « arcadia-postgres » et « arcadia-web »,
# repris tels quels dans DATABASE_URL et dans deploy/caddy/arcadia.caddy.
#
# Usage sur le serveur (depuis /home/<VPS_USER>/arcadia-app) :
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
#
# Toutes les commandes d'exploitation sont dans docs/deploiement.md.

name: arcadia

services:
  # ─── Base de données ────────────────────────────────────────────────────────
  arcadia-postgres:
    image: postgres:16-alpine
    container_name: arcadia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # AUCUN port publié : la base n'est joignable que depuis le réseau arcadia.
    # Pour l'inspecter depuis le poste local, passer par un tunnel SSH
    # (voir docs/deploiement.md § Exploitation).
    networks:
      - arcadia
    volumes:
      - arcadia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb

  # ─── Application Next.js ────────────────────────────────────────────────────
  arcadia-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: arcadia-web:latest
    container_name: arcadia-web
    restart: unless-stopped
    # Secrets et configuration runtime. Ce fichier n'est JAMAIS commité.
    env_file: .env.production
    environment:
      # Surcharges non secrètes, explicites pour éviter toute dérive :
      # sans NODE_ENV=production, les cookies de session partiraient sans
      # l'attribut Secure (voir src/server/auth/session.ts).
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      arcadia-postgres:
        condition: service_healthy
    networks:
      # Réseau privé : accès à arcadia-postgres.
      - arcadia
      # Réseau de la stack Blob : permet à Caddy d'atteindre arcadia-web:3000.
      - blob-proxy
    # AUCUN port publié sur l'hôte : tout le trafic public passe par Caddy.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

# ─── Réseaux ──────────────────────────────────────────────────────────────────
networks:
  # Sous-réseau dédié. 172.20 (pre-vps), 172.21 (vps) et 172.22 (blobsurf legacy)
  # sont déjà utilisés par Blob : ne pas réutiliser ces plages.
  arcadia:
    name: arcadia
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

  # Réseau EXISTANT de la stack Blob, créé par docker-compose.vps.yml.
  # `external: true` signifie : ne pas le créer, ne pas le supprimer, s'y attacher.
  # Un `docker compose down` d'ArcadiA ne touchera donc jamais au réseau de Blob.
  blob-proxy:
    external: true
    name: blobconnect-vps_vps

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  # Volume nommé, indépendant des volumes Blob (pgdata-vps, miniodata-vps).
  # Contient TOUTES les données pédagogiques : ne jamais le supprimer sans
  # sauvegarde vérifiée.
  arcadia-pgdata:
    name: arcadia-pgdata
