name: pse-interactif-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PSE_POSTGRES_DB:?PSE_POSTGRES_DB is required}
      POSTGRES_USER: ${PSE_POSTGRES_USER:?PSE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${PSE_POSTGRES_PASSWORD:?PSE_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    shm_size: 128mb

volumes:
  postgres_data:
    name: pse-interactif-dev-postgres-data
