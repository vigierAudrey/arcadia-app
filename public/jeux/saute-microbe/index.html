<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saute-Microbe</title>
    <link rel="stylesheet" href="jeu.css">
    <link rel="icon" href="data:,">
    <script src="jeu.js"></script>
</head>

<body id="t" class="offline">
    <div id="main-frame-error" class="interstitial-wrapper">
        <div id="main-content">
            <div class="icon icon-offline" aria-hidden="true"></div>
        </div>
        <p class="consigne">Barre d'espace ou clic pour sauter. Flèche du bas pour se baisser.</p>
        <div id="offline-resources">
            <img id="microbes-1x" src="microbes-1x.png" alt="">
            <img id="microbes-2x" src="microbes-2x.png" alt="">
        </div>
    </div>

    <script>
        // Le jeu est affiché dans une fenêtre de la page de séance : il doit
        // prendre le clavier, sinon la barre d'espace fait défiler la page.
        window.addEventListener('load', function () {
            window.focus();
        });

        // À la souris, un clic saute aussi (au doigt, le moteur gère déjà l'appui).
        document.addEventListener('pointerdown', function (event) {
            window.focus();
            if (event.pointerType === 'touch') return;
            document.dispatchEvent(new KeyboardEvent('keydown', { keyCode: 32, which: 32 }));
            document.dispatchEvent(new KeyboardEvent('keyup', { keyCode: 32, which: 32 }));
        });
    </script>
</body>

</html>
